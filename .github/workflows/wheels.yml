# Build wheels for CPython 3.11-3.13 on Linux (manylinux_2_28), Windows and
# macOS (arm64) with cibuildwheel, and publish them to PyPI on a version tag.
#
# cesium-native pulls ~30 vcpkg ports (abseil, draco, s2geometry, ktx, ...)
# and compiles them from source: the first run per OS takes 1-3 h.  The vcpkg
# tree (~/.ezvcpkg) is cached between runs, which brings later runs to the
# bindings only (~15 min).  On Linux the build runs inside the manylinux
# container; cibuildwheel mounts the runner's filesystem at /host, so the same
# cache directory is used there.
name: wheels

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Runners to build on (JSON list)"
        default: '["ubuntu-24.04", "windows-2022", "macos-15"]'
      release_tag:
        description: "Attach the wheels to this GitHub Release (created if missing); empty = artifacts only"
        default: ""
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-24.04", "windows-2022", "macos-15"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false   # build scripts of ~30 ports run below

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # restore / save split so the vcpkg tree is kept even when the wheel step
      # fails: the ports that did build are not rebuilt on the next run. The
      # key ends with the run id, so every run saves its own (possibly more
      # complete) tree and the next run restores the newest one by prefix.
      - name: Restore vcpkg tree
        id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # the vcpkg clone + installed prefix (~1.5 GB per OS); build trees,
          # downloads and packages are not needed to reuse the ports
          path: |
            ~/.ezvcpkg
            !~/.ezvcpkg/*/buildtrees
            !~/.ezvcpkg/*/downloads
            !~/.ezvcpkg/*/packages
          key: ezvcpkg-v2-${{ runner.os }}-${{ hashFiles('extern/cesium-native/vcpkg.json', 'extern/cesium-native/cmake/ezvcpkg/**') }}-${{ github.run_id }}
          restore-keys: |
            ezvcpkg-v2-${{ runner.os }}-${{ hashFiles('extern/cesium-native/vcpkg.json', 'extern/cesium-native/cmake/ezvcpkg/**') }}-
            ezvcpkg-v2-${{ runner.os }}-

      - name: Build wheels
        run: |
          python -m pip install -U pip cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp311-* cp312-* cp313-*
          CIBW_SKIP: "*musllinux*"
          CIBW_ARCHS: auto64
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ENVIRONMENT: CMAKE_BUILD_PARALLEL_LEVEL=4 VCPKG_MAX_CONCURRENCY=4
          # Linux: vcpkg needs these to bootstrap and build its ports
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >
            dnf install -y curl zip unzip tar nasm ninja-build perl-core
            autoconf automake libtool pkgconfig
          CIBW_ENVIRONMENT_LINUX: >
            EZVCPKG_BASEDIR=/host/home/runner/.ezvcpkg
            CMAKE_BUILD_PARALLEL_LEVEL=4 VCPKG_MAX_CONCURRENCY=4
          # macOS: Homebrew tools for the same ports; macos-14 and later are arm64
          # (GitHub retired the macos-14 runner in November 2026)
          CIBW_BEFORE_ALL_MACOS: brew install nasm ninja autoconf automake libtool pkg-config
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET=12.0
            CMAKE_BUILD_PARALLEL_LEVEL=4 VCPKG_MAX_CONCURRENCY=4
          # the extension links everything statically: no wheel repair needed
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""
          CIBW_TEST_COMMAND: python -c "import cesium; from cesium.tiles import content; content.register_all_tile_content_types(); print('cesium ok')"

      - name: Save vcpkg tree
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.ezvcpkg
            !~/.ezvcpkg/*/buildtrees
            !~/.ezvcpkg/*/downloads
            !~/.ezvcpkg/*/packages
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  release:
    # GitHub Release assets: on a v* tag, or on a manual run with release_tag.
    # Downstream installers (e.g. the Blender add-on) fetch wheels from here.
    #
    # Runs as soon as the build matrix is over, even when a runner failed
    # (macOS runners are regularly lost to capacity), and attaches the wheels
    # that did build. The release notes say which runners are still missing
    # and the release stays a pre-release until the set is complete, so
    # "latest" keeps pointing at the previous complete release meanwhile.
    # "Re-run failed jobs" on the run re-runs this job too: it then adds the
    # new wheels and updates the notes (artifacts of earlier attempts stay
    # available to the re-run). always(): a runner that never starts (label
    # retired, no capacity) keeps the run queued for hours, and the only way
    # out is to cancel the run; the wheels that did build are released anyway.
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') }}
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # one directory per runner that produced wheels (art/wheels-<os>/)
          pattern: wheels-*
          path: art
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          EXPECTED: ${{ inputs.os || '["ubuntu-24.04", "windows-2022", "macos-15"]' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          mkdir -p dist
          built=""
          for d in art/wheels-*/; do
            [ -d "$d" ] || continue
            cp "$d"*.whl dist/
            built="$built ${d#art/wheels-}"
          done
          # one runner name per line, both lists sorted the same way for comm
          for b in $built; do echo "${b%/}"; done | sort > built.txt
          echo "$EXPECTED" | jq -r '.[]' | tr -d '\r' | sort > expected.txt
          built=$(cat built.txt)
          pending=$(comm -23 expected.txt built.txt)
          n=$(ls dist/*.whl 2>/dev/null | wc -l)
          [ "$n" -gt 0 ] || { echo "no runner produced a wheel, nothing to release"; exit 1; }

          {
            echo "cesium-native-python wheels (CPython 3.11-3.13; Linux x86_64, Windows x64, macOS arm64),"
            echo "built from $GITHUB_SHA by [this run]($RUN_URL)."
            echo
            if [ -z "$pending" ]; then
              echo "All $n wheels attached ($(echo $built | tr ' ' ',' | sed 's/,/, /g'))."
            else
              echo "**Incomplete:** $n wheels attached so far ($(echo $built | sed 's/ /, /g'))."
              echo "Still missing: $(echo $pending | sed 's/ /, /g'). Re-run the failed jobs of the run above;"
              echo "this release is updated, and leaves pre-release, when they land."
            fi
          } > notes.md

          # the tag is created at the commit that was built, not at the default branch
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" \
              --prerelease --notes-file notes.md || \
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null   # created concurrently
          # wheels with the same file name are replaced, the other runners' wheels stay
          gh release upload "$TAG" dist/*.whl --repo "$GITHUB_REPOSITORY" --clobber
          if [ -z "$pending" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --prerelease=false --latest
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --prerelease
          fi

  publish:
    # PyPI trusted publishing: register this repository + workflow under the
    # project's "Publishing" settings on pypi.org, then tag v*.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tag must match the package version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but pyproject version $v"; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
