# Build one wheel and run the test suite on every pull request and on pushes to
# main. One CPython (3.12) in the manylinux container, so the vcpkg tree saved
# by the wheels workflow is reused (same key, same toolchain): about 20 min
# when the cache is warm, 1-3 h when a vcpkg baseline change empties it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ubuntu-24.04 cp312, pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Restore vcpkg tree
        id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.ezvcpkg
            !~/.ezvcpkg/*/buildtrees
            !~/.ezvcpkg/*/downloads
            !~/.ezvcpkg/*/packages
          key: ezvcpkg-v2-${{ runner.os }}-${{ hashFiles('extern/cesium-native/vcpkg.json', 'extern/cesium-native/cmake/ezvcpkg/**') }}-${{ github.run_id }}
          restore-keys: |
            ezvcpkg-v2-${{ runner.os }}-${{ hashFiles('extern/cesium-native/vcpkg.json', 'extern/cesium-native/cmake/ezvcpkg/**') }}-
            ezvcpkg-v2-${{ runner.os }}-

      - name: Build one wheel and run the tests
        run: |
          python -m pip install -U pip cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp312-manylinux_x86_64
          CIBW_BUILD_VERBOSITY: 1
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >
            dnf install -y curl zip unzip tar nasm ninja-build perl-core
            autoconf automake libtool pkgconfig
          CIBW_ENVIRONMENT_LINUX: >
            EZVCPKG_BASEDIR=/host/home/runner/.ezvcpkg
            CMAKE_BUILD_PARALLEL_LEVEL=4 VCPKG_MAX_CONCURRENCY=4
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest -q {project}/tests

      # keep a (possibly more complete) tree for the next run, as wheels.yml does
      - name: Save vcpkg tree
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.ezvcpkg
            !~/.ezvcpkg/*/buildtrees
            !~/.ezvcpkg/*/downloads
            !~/.ezvcpkg/*/packages
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-ubuntu-24.04-cp312
          path: wheelhouse/*.whl
